name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.0
      - name: Build mod (bis zu 3 Versuche bei Netzwerkfehlern)
        run: |
          for i in 1 2 3; do
            gradle build --no-daemon && exit 0
            echo "Versuch $i fehlgeschlagen, neuer Versuch in 15 Sekunden..."
            sleep 15
          done
          exit 1
      - name: Check jar contents
        run: |
          JAR=$(ls build/libs/*.jar | head -n 1)
          echo "Jar: $JAR"
          unzip -l "$JAR"
          unzip -l "$JAR" | grep -q "META-INF/mods.toml"
          unzip -l "$JAR" | grep -q "pack.mcmeta"
          unzip -l "$JAR" | grep -q "de/rupturereborn/RuptureReborn.class"
      - uses: actions/upload-artifact@v4
        with:
          name: rupture-reborn-1.21.11-jar
          path: build/libs/*.jar
